<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한 끼 예산 식권</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column, a meal-ticket card on top, then menu picks, then the eating log */
:root{
  --bg:#f3f5f1; --paper:#ffffff; --ink:#1d2421; --muted:#66706b; --line:#d9dfd9;
  --accent:#1f5fbf; --accent-soft:#e3ecfa; --stamp:#c8372d;
  --ok:#1f7a4d; --ok-soft:#e1f2e8; --warn:#a86a00; --warn-soft:#fbefd6; --bad:#b3261e; --bad-soft:#fbe3e1;
  --display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121614; --paper:#1b201d; --ink:#e8ece9; --muted:#9aa49f; --line:#2f3632;
  --accent:#7aa8f0; --accent-soft:#1d2a3d; --stamp:#f07a6f;
  --ok:#6fcf9b; --ok-soft:#163223; --warn:#e8b55a; --warn-soft:#352a14; --bad:#f08a82; --bad-soft:#3a1d1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --paper:#1b201d; --ink:#e8ece9; --muted:#9aa49f; --line:#2f3632;
  --accent:#7aa8f0; --accent-soft:#1d2a3d; --stamp:#f07a6f;
  --ok:#6fcf9b; --ok-soft:#163223; --warn:#e8b55a; --warn-soft:#352a14; --bad:#f08a82; --bad-soft:#3a1d1b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:30px;letter-spacing:.01em}
h2{font-size:22px}
.sub{color:var(--muted);margin:2px 0 0;font-size:14px}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ticket */
.ticket{background:var(--paper);border:1.5px dashed var(--line);border-radius:14px;padding:20px;position:relative;overflow:hidden}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:var(--bg);transform:translateY(-50%)}
.ticket::before{left:-12px}.ticket::after{right:-12px}
.t-label{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:500}
.t-amount{font-family:var(--display);font-size:52px;line-height:1.1;color:var(--accent);margin:4px 0 6px}
.t-amount small{font-size:24px;margin-left:2px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:3px 10px;border-radius:999px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.stat b{display:block;font-size:16px}
.stat span{font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.formula{font-size:13px;color:var(--muted);margin-top:10px}

/* settings */
details{background:var(--paper);border:1px solid var(--line);border-radius:12px}
summary{padding:12px 16px;cursor:pointer;font-weight:500;list-style:none;display:flex;justify-content:space-between}
summary::after{content:"＋";color:var(--muted)} details[open] summary::after{content:"－"}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 16px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:15px;width:100%;min-width:0}
.full{grid-column:1/-1}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 14px;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:500}
.btn.ghost{background:transparent;color:var(--muted)}

/* recs */
.head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.recs{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.rec{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.rec .name{font-weight:700;min-width:0}
.rec .meta{font-size:12px;color:var(--muted);grid-column:1}
.rec .price{font-weight:700;text-align:right}
.rec .fit{font-size:12px;text-align:right}
.fit.just{color:var(--accent)}.fit.save{color:var(--ok)}
.rec .eat{grid-column:1/-1;justify-self:start;margin-top:4px}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--muted);font-size:14px}
.note{font-size:12px;color:var(--muted);margin-top:8px}

/* log */
.logform{display:grid;grid-template-columns:1fr 110px auto;gap:8px;margin-top:12px}
.log{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column}
.log li{display:grid;grid-template-columns:28px 1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.log .no{font-size:12px;color:var(--muted)}
.log .d{font-size:12px}
.d.over{color:var(--bad)}.d.under{color:var(--ok)}
.x{border:none;background:none;color:var(--muted);font-size:18px;padding:0 4px}
.stamp{font-family:var(--display);color:var(--stamp);border:2px solid var(--stamp);border-radius:6px;padding:0 6px;transform:rotate(-6deg);display:inline-block;font-size:14px;position:absolute;right:18px;top:18px;opacity:.85}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:14px}
@media (max-width:420px){.t-amount{font-size:44px}.logform{grid-template-columns:1fr 96px}.logform .btn{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>한 끼 예산 식권</h1>
    <p class="sub">예산 ÷ 남은 끼니 = 이번 끼니에 쓸 수 있는 돈. 먹을 때마다 다시 계산해요.</p>
  </header>

  <section class="ticket" aria-live="polite">
    <span class="stamp" id="stamp" hidden>마감</span>
    <div class="t-label">이번 끼니 예산</div>
    <div class="t-amount num" id="perMeal">10,000<small>원</small></div>
    <span class="pill ok" id="status">계획대로 가는 중</span>
    <div class="bar"><i id="barFill" style="width:0%"></i></div>
    <div class="stats">
      <div class="stat"><b class="num" id="sRemain">100,000원</b><span>남은 예산</span></div>
      <div class="stat"><b class="num" id="sMeals">10끼</b><span>남은 끼니</span></div>
      <div class="stat"><b class="num" id="sSpent">0원</b><span>쓴 돈</span></div>
    </div>
    <div class="formula num" id="formula"></div>
  </section>

  <details id="settings">
    <summary>예산 설정</summary>
    <form class="grid" id="setForm">
      <label class="full">예산 (원)<input id="budget" type="number" inputmode="numeric" min="0" step="1000" value="100000"></label>
      <label>기간<select id="period"><option value="1">1주</option><option value="2">2주</option><option value="4">한 달 (4주)</option></select></label>
      <label>주당 등교일<input id="days" type="number" min="1" max="7" value="5"></label>
      <label>하루 끼니 수<input id="meals" type="number" min="1" max="5" value="2"></label>
      <label>총 끼니<input id="total" type="text" readonly tabindex="-1"></label>
      <div class="full" style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn primary" type="submit">저장</button>
        <button class="btn ghost" type="button" id="resetBtn">기록 비우고 새로 시작</button>
      </div>
      <div class="full note" id="resetConfirm" hidden>
        먹은 기록이 모두 지워져요. <button class="btn" type="button" id="resetYes">지우기</button> <button class="btn ghost" type="button" id="resetNo">취소</button>
      </div>
    </form>
  </details>

  <section>
    <div class="head">
      <div><h2>이 돈으로 먹을 수 있는 메뉴</h2><p class="sub" id="recSub"></p></div>
      <button class="btn" id="shuffle" type="button">다른 메뉴 보기</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="종류"></div>
    <div class="recs" id="recs"></div>
    <p class="note">가격은 서울 대학가 기준 대략적인 시세예요. 먹고 나서 실제 낸 금액으로 고쳐 적으면 다음 끼니 예산이 정확해져요.</p>
  </section>

  <section>
    <h2>먹은 기록</h2>
    <form class="logform" id="logForm">
      <input id="lName" placeholder="메뉴 (예: 학식 백반)" aria-label="메뉴">
      <input id="lPrice" type="number" inputmode="numeric" min="0" step="100" placeholder="금액" aria-label="금액">
      <button class="btn primary" type="submit">기록</button>
    </form>
    <ul class="log" id="log"></ul>
    <div class="empty" id="logEmpty">아직 기록이 없어요. 위에서 메뉴의 ‘이걸로 먹기’를 누르거나 직접 적어 주세요.</div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const MENUS=[
 ["학식 라면","학식",3500],["학식 백반","학식",5000],["학식 돈까스","학식",5500],["학식 특식","학식",6500],
 ["삼각김밥+컵라면","편의점",3500],["편의점 샌드위치","편의점",3500],["편의점 도시락","편의점",5500],["편의점 파스타","편의점",5000],["컵밥","편의점",4500],
 ["김밥 한 줄","분식",3500],["토스트","분식",3500],["라면","분식",4500],["떡볶이","분식",5000],["김밥+라면","분식",8000],["돈까스(분식집)","분식",8500],
 ["제육덮밥","한식",8000],["김치찌개","한식",9000],["순두부찌개","한식",9000],["비빔밥","한식",9000],["칼국수","한식",8500],["국밥","한식",10000],["냉면","한식",10000],
 ["짜장면","중식",7000],["짬뽕","중식",8500],["볶음밥","중식",8000],["마라탕","중식",12000],
 ["햄버거 세트","양식·기타",8000],["서브웨이 15cm","양식·기타",7500],["쌀국수","양식·기타",10000],["포케","양식·기타",12000],
 ["규동","일식",7500],["라멘","일식",10000],["초밥 세트","일식",13000],["가츠동","일식",9000]
];
const CATS=["전체","학식","편의점","분식","한식","중식","일식","양식·기타"];
const won=n=>Math.round(n).toLocaleString("ko-KR")+"원";
const $=id=>document.getElementById(id);

let state={budget:100000,period:1,days:5,meals:2,log:[]};
try{const s=JSON.parse(localStorage.getItem("bapgap")||"null");if(s)state={...state,...s}}catch(e){}
const save=()=>{try{localStorage.setItem("bapgap",JSON.stringify(state))}catch(e){}};
let cat="전체", seed=0;

function totalMeals(){return state.period*state.days*state.meals}
function calc(){
  const n=totalMeals(), eaten=state.log.length;
  const spent=state.log.reduce((a,b)=>a+b.price,0);
  const remain=state.budget-spent, left=Math.max(0,n-eaten);
  const base=n?state.budget/n:0;
  const per=left?remain/left:0;
  return {n,eaten,spent,remain,left,base,per};
}

function render(){
  const c=calc();
  $("total").value=c.n+"끼";
  $("perMeal").innerHTML=(c.left?won(Math.max(0,c.per)).replace("원",""):"0")+"<small>원</small>";
  $("sRemain").textContent=won(c.remain);
  $("sMeals").textContent=c.left+"끼";
  $("sSpent").textContent=won(c.spent);
  $("barFill").style.width=(c.n?Math.min(100,c.eaten/c.n*100):0)+"%";
  $("stamp").hidden=c.left>0;
  $("formula").textContent=c.left
    ? `${won(c.remain)} ÷ ${c.left}끼 · 처음 계획은 한 끼 ${won(c.base)}`
    : `계획한 ${c.n}끼를 다 먹었어요. ${c.remain>=0?won(c.remain)+" 남았어요.":won(-c.remain)+" 초과했어요."}`;
  const st=$("status"); const r=c.base?c.per/c.base:1;
  if(c.remain<0||(c.left&&c.per<2500)){st.className="pill bad";st.textContent=c.remain<0?"예산 초과":"이번 주 빠듯해요";}
  else if(r<0.9){st.className="pill warn";st.textContent="조금 아껴야 해요";}
  else if(r>1.1){st.className="pill ok";st.textContent="여유 있어요";}
  else{st.className="pill ok";st.textContent="계획대로 가는 중";}
  renderRecs(c); renderLog(c);
}

function shuffleArr(a,s){a=a.slice();let x=s*9301+49297;for(let i=a.length-1;i>0;i--){x=(x*9301+49297)%233280;const j=Math.floor(x/233280*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}

function renderRecs(c){
  const limit=c.left?c.per:0;
  $("recSub").textContent=c.left?`한 끼 ${won(limit)} 이하 메뉴`:"남은 끼니가 없어요";
  let pool=MENUS.filter(m=>(cat==="전체"||m[1]===cat)&&m[2]<=limit);
  const box=$("recs");
  if(!pool.length){
    const cheapest=MENUS.filter(m=>cat==="전체"||m[1]===cat).sort((a,b)=>a[2]-b[2])[0];
    box.innerHTML=`<div class="empty">${c.left?`이 예산으로 고를 수 있는 ${cat==="전체"?"":cat+" "}메뉴가 없어요. 가장 싼 건 ${cheapest[0]} (${won(cheapest[2])})예요. 다른 끼니를 아끼거나 집밥으로 채워 보세요.`:"설정에서 새 기간을 시작하세요."}</div>`;
    return;
  }
  // 예산에 가까운 메뉴 2개 + 아끼는 메뉴 섞어서 5개
  const sorted=pool.slice().sort((a,b)=>b[2]-a[2]);
  const near=shuffleArr(sorted.filter(m=>m[2]>=limit*0.75),seed).slice(0,3);
  const rest=shuffleArr(pool.filter(m=>!near.includes(m)),seed+7).slice(0,5-near.length);
  const picks=[...near,...rest].sort((a,b)=>b[2]-a[2]);
  box.innerHTML=picks.map(m=>{
    const diff=limit-m[2]; const just=m[2]>=limit*0.75;
    return `<div class="rec"><div class="name">${m[0]}</div><div class="price num">${won(m[2])}</div>
      <div class="meta">${m[1]}</div><div class="fit num ${just?"just":"save"}">${just?"예산에 딱 맞음":won(diff)+" 아낌"}</div>
      <button class="btn eat" type="button" data-n="${m[0]}" data-p="${m[2]}">이걸로 먹기</button></div>`}).join("");
}

function renderLog(c){
  const ul=$("log"); $("logEmpty").hidden=state.log.length>0;
  let remain=state.budget, left=c.n;
  ul.innerHTML=state.log.map((l,i)=>{
    const allow=left>0?remain/left:0; const d=allow-l.price;
    remain-=l.price; left--;
    return `<li><span class="no num">${i+1}</span><span>${l.name}</span>
      <span class="num" style="text-align:right">${won(l.price)}<br><span class="d ${d<0?"over":"under"}">${d<0?"+"+won(-d)+" 초과":won(d)+" 남김"}</span></span>
      <button class="x" type="button" data-i="${i}" aria-label="${l.name} 삭제">×</button></li>`}).reverse().join("");
}

function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,1800)}
function addMeal(name,price){
  if(calc().left<=0){toast("계획한 끼니를 다 먹었어요");return}
  state.log.push({name,price});save();render();
  const c=calc(); toast(c.left?`기록했어요 · 다음 끼니 ${won(c.per)}`:"기록했어요 · 이번 기간 끝!");
}

$("chips").innerHTML=CATS.map(k=>`<button class="chip" type="button" aria-pressed="${k===cat}">${k}</button>`).join("");
$("chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;cat=b.textContent;
  document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===b));render()});
$("shuffle").onclick=()=>{seed++;render()};
$("recs").addEventListener("click",e=>{const b=e.target.closest(".eat");if(b)addMeal(b.dataset.n,+b.dataset.p)});
$("log").addEventListener("click",e=>{const b=e.target.closest(".x");if(!b)return;state.log.splice(+b.dataset.i,1);save();render()});
$("logForm").addEventListener("submit",e=>{e.preventDefault();const n=$("lName").value.trim(),p=+$("lPrice").value;
  if(!n||!(p>=0)||$("lPrice").value===""){toast("메뉴와 금액을 적어 주세요");return}
  addMeal(n,p);$("lName").value="";$("lPrice").value=""});

["budget","period","days","meals"].forEach(k=>$(k).value=state[k]);
$("setForm").addEventListener("input",()=>{$("total").value=(+$("period").value)*(+$("days").value||0)*(+$("meals").value||0)+"끼"});
$("setForm").addEventListener("submit",e=>{e.preventDefault();
  state.budget=Math.max(0,+$("budget").value||0);state.period=+$("period").value;
  state.days=Math.min(7,Math.max(1,+$("days").value||1));state.meals=Math.min(5,Math.max(1,+$("meals").value||1));
  save();render();toast("저장했어요")});
$("resetBtn").onclick=()=>$("resetConfirm").hidden=false;
$("resetNo").onclick=()=>$("resetConfirm").hidden=true;
$("resetYes").onclick=()=>{state.log=[];save();$("resetConfirm").hidden=true;render();toast("새로 시작해요")};
render();
</script>
</body>
</html>
